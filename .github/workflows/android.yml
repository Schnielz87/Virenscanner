name: SVS Security (Android) bauen & veroeffentlichen

on:
  push:
    paths-ignore:
      - "**.md"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Unit-Tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon testDebugUnitTest

      - name: APK bauen
        run: |
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk SVS-Security.apk
          echo "VERSION=1.0.$((BUILD_NUMBER + 10))" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: SVS-Security-APK
          path: SVS-Security.apk

      # Fester Link: https://github.com/Schnielz87/Virenscanner/releases/download/neueste-version/SVS-Security.apk
      # Die App liest den Titel "SVS Security v1.0.<n>" und bietet neuere Versionen als Update an.
      - name: Als Release veroeffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete neueste-version --yes --cleanup-tag || true
          gh release create neueste-version SVS-Security.apk \
            --target "${{ github.sha }}" \
            --title "SVS Security v${VERSION}" \
            --notes "Sicherheits-App für Android (Virenscan, Verlauf, Web-Schutz, Warnungen, Gesamtübersicht). Version ${VERSION}, gebaut aus Commit ${{ github.sha }}. Auf dem Handy SVS-Security.apk herunterladen und öffnen."
